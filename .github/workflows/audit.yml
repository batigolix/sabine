# AI generated
name: Security audit

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Composer audit
        run: composer audit --locked --format=plain

  npm-audit:
    runs-on: ubuntu-latest
    if: hashFiles('web/themes/custom/**/package-lock.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: NPM audit per theme
        run: |
          for lock in web/themes/custom/*/package-lock.json; do
            dir=$(dirname "$lock")
            echo "::group::$dir"
            (cd "$dir" && npm audit --omit=dev) || echo "::warning::$dir has advisories"
            echo "::endgroup::"
          done
