# AI generated
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, cs2pr
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache composer deps
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPCS (Drupal + DrupalPractice)
        run: |
          bin/phpcs -n \
            --standard=Drupal,DrupalPractice \
            --extensions=php,module,inc,install,test,profile,theme,info,yml \
            --report=checkstyle \
            web/modules/custom web/themes/custom \
          | cs2pr

      - name: PHPStan
        run: bin/phpstan analyse --no-progress --error-format=github

  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'web/themes/custom/**/package-lock.json'
      - name: Install + build (per theme)
        run: |
          shopt -s nullglob
          for pkg in web/themes/custom/*/package.json; do
            dir=$(dirname "$pkg")
            echo "::group::$dir"
            (cd "$dir" && npm ci && npm run build)
            echo "::endgroup::"
          done
